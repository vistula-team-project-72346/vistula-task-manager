<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Contribution</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
    }
    button {
      padding: 10px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Team Contribution</h1>
  <button id="load-contributor">Show Contributor</button>
  <p id="contributor-student-id"></p>
  <p><a href="index.html">Back to Task Manager</a></p>

  <script>
    document.getElementById('load-contributor').addEventListener('click', async function() {
      const output = document.getElementById('contributor-student-id');

      try {
        const response = await fetch('contribution.json');

        if (!response.ok) {
          throw new Error('Could not load contributor');
        }

        const data = await response.json();
        output.textContent = 'Contributor Student ID: ' + data.contributorStudentId;
      } catch (error) {
        output.textContent = 'Could not load contributor information.';
      }
    });
  </script>
</body>
</html>
